name: Action self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  action:
    name: Action self-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run the Action keyless
        uses: ./
        with:
          fail-on-severity: none
