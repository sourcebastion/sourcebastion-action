name: Feature request
description: Suggest an improvement to the SourceBastion GitHub Action
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Automation may assess the request, but
        issue-derived changes remain open for human review.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed outcome
      description: What would a successful result look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List workarounds or other approaches you considered.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-report safety
      options:
        - label: This request contains no secrets or private vulnerability details.
          required: true
